name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package addon folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd addons
          zip -r "../dist/FADE-Godot-${GITHUB_REF_NAME}.zip" fade_editor

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/FADE-Godot-${{ github.ref_name }}.zip
